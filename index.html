<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blushh — Legal</title>
<meta name="description" content="Blushh legal documents: Privacy Policy and Terms of Service.">
<style>
  :root {
    --bg: #fffafb;
    --text: #2b2330;
    --muted: #6f6377;
    --accent: #d94f70;
    --accent-dark: #b83a5a;
    --card: #ffffff;
    --border: #f0dde3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 64px;
  }
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
    margin: 0 0 8px;
  }
  .tagline { color: var(--muted); margin: 0; }
  .cards { display: grid; gap: 16px; margin-top: 32px; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover, a.card:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(217, 79, 112, 0.12);
  }
  .card h2 { margin: 0 0 6px; font-size: 1.15rem; color: var(--accent-dark); }
  .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  footer {
    margin-top: 56px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--accent-dark); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">Blushh</h1>
    <p class="tagline">The dating app for college students.</p>
  </header>

  <main>
    <div class="cards">
      <a class="card" href="privacy/">
        <h2>Privacy Policy</h2>
        <p>What we collect, why, how we protect it, and the choices you have.</p>
      </a>
      <a class="card" href="terms/">
        <h2>Terms of Service</h2>
        <p>The agreement that governs your use of Blushh.</p>
      </a>
    </div>
  </main>

  <footer>
    <p>Questions? <a href="mailto:support@getblushh.com">support@getblushh.com</a></p>
  </footer>
</div>
</body>
</html>
